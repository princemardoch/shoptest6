<!DOCTYPE html>
<html lang="fr" style="font-family: 'Inter', 'system-ui';">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande confirmée - Shilajit de l'Himalaya | Baobao</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <meta name="description" content="Merci pour votre commande de Shilajit ! Votre achat a été confirmé et est en cours de traitement. Livraison gratuite à Abidjan.">
    <meta name="keywords" content="confirmation de commande, Shilajit, achat réussi, livraison Abidjan">

    <link rel="icon" href="{{ url_for('static', filename='logos/favicon.png') }}" type="image/x-icon">

    <meta property="og:title" content="Commande confirmée - Shilajit de l'Himalaya | Baobao">
    <meta property="og:description" content="Votre commande de Shilajit pur a été traitée avec succès. Merci pour votre confiance !">
    <meta property="og:image" content="{{ url_for('user.static', filename='product.png') }}">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Commande confirmée - Shilajit | Baobao">
    <meta name="twitter:description" content="Votre achat de Shilajit a été confirmé. Merci d'avoir choisi Baobao !">
    <meta name="twitter:image" content="{{ url_for('user.static', filename='product.png') }}">

    <meta name="robots" content="noindex, nofollow">
    
    <style>
        body {
            background-color: #f0f0f0;
            background-image: url("{{ url_for('static', filename='icons/confeti.svg') }}");
            background-size: auto;
        }
        
        .shadow-centered {
            box-shadow: 0 0 5px 0 rgba(0, 0, 0, 0.1);
        }
  
    </style>
</head>
<body class="w-full flex justify-center flex-col items-center bg-[#fbfbfb]">
    <section class="w-96 h-full m-2 max-[320px]:w-full max-sm:p-2">

        <div class="w-full h-full bg-white mt-2 my-4 shadow-centered rounded-2xl">
            <nav class="w-full flex justify-between items-center p-3">
                <div class="h-7 w-7 rounded flex justify-center items-center cursor-pointer hover:bg-gray-100">
                    <p class="text-xl">←</p>
                </div>
                <p class="text-center text-2xl"> 🛍️ </p>
                
            </nav>
        </div>

        <div id="success_card" class="w-full h-full flex justify-center items-center flex-col bg-white my-4 shadow-centered rounded-2xl p-5">
            <p class="text-4xl">🎉</p>
            <p class="text-xl mt-3 font-semibold flex text-center"> 
                Bravo,<br>
                commande effectuée
            </p>
            <img src="{{ url_for('user.static', filename='icons/arrow.svg') }}" alt="arrow" class="w-6 m-4">

            <div class="w-28 h-28 bg-gray-100 rounded-xl">
                <img src="{{ url_for('user.static', filename='product.png') }}" alt="Shilajit de l'Himalaya" class="w-full h-full object-cover rounded-xl">
            </div>
            <p class="text-center w-32 mt-2 w-full text-xl font-bold"> {{ product_name }} </p>
            <div class="w-20 h-[1px] bg-gray-200 m-3"></div>
            
            <div class="text-center space-y-2 mb-4">
                <p class="text-center"> Format → <strong> {{ product_format }} </strong> </p>
                <p class="text-center"> Quantité → <strong> {{ quantity }} </strong> </p>
                <p class="text-center"> Livraison → <strong> Demain </strong> </p>
            </div>
            
            <div class="text-xl h-12 flex justify-center items-center font-bold px-4 py-2 bg-gray-100 rounded-xl m-2"> 💰 {{ "{:,}".format(total_price|int) }} ₣ </div>
           
            <div class="w-full mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="text-yellow-700 text-sm text-center font-medium">
                    ⚡ Merci pour votre confiance ! ⚡<br>
                    <span class="text-xs">Votre bien-être naturel commence maintenant</span>
                </p>
            </div>
        </div>
        
        <div class="w-full h-full flex justify-center items-center flex-col bg-white my-3 shadow-centered rounded-2xl p-5">
            <h4> 
                <span class="opacity-70">
                    Powered by
                </span> 
                <a href="https://baobao.ci" class="hover:text-[#ffb800]">
                     <span class="opacity-100">
                        <strong>
                            Baobao
                        </strong>
                    </span>
                </a> 
            </h4>
        </div>
    </section>
</body>
</html>
