<!DOCTYPE html>
<html lang="fr" style="font-family: 'Inter', 'system-ui';">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de commande - Shilajit de l'Himalaya</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <meta name="description" content="Finalisez votre achat de Shilajit de l'Himalaya en toute sécurité. Livraison gratuite à Abidjan.">
    <meta name="keywords" content="validation de commande, Shilajit, paiement sécurisé, livraison Abidjan">

    <link rel="icon" href="{{ url_for('static', filename='logos/favicon.png') }}" type="image/x-icon">

    <meta property="og:title" content="Validation de commande - Shilajit de l'Himalaya">
    <meta property="og:description" content="Terminez votre achat de Shilajit pur en toute confiance. Livraison gratuite à Abidjan.">
    <meta property="og:image" content="{{ url_for('user.static', filename='product.png') }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Validation de commande - Shilajit de l'Himalaya">
    <meta name="twitter:description" content="Finalisez votre commande de Shilajit en quelques étapes simples. Paiement à la livraison.">

<style>
    body {
    background-color: #f0f0f0;
    background-image: radial-gradient(circle, rgba(0, 0, 0, 0.02) 20%, transparent 20%), radial-gradient(circle, #fbfbfb 20%, transparent 20%);
    background-size: 10px 10px;
    background-position: 0 0, 20px 20px;
}

.shadow-centered {
    box-shadow: 0 0 5px 0 rgba(0, 0, 0, 0.1);
}

</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function formatPhoneNumber(value) {
            var cleaned_length = 10;

            let cleaned = value.replace(/\D/g, '');
            if (cleaned.length > cleaned_length) {
                cleaned = cleaned.slice(0, cleaned_length);
            }
            
            let formattedValue = '';
            if (cleaned.length === 9) {
                formattedValue = cleaned.replace(/(\d{2})(\d{3})(\d{4})/, '$1 $2 $3');
            } else {
                for (let i = 0; i < cleaned.length; i += 2) {
                    if (i > 0) {
                        formattedValue += ' ';
                    }
                    formattedValue += cleaned.substring(i, i + 2);
                }
            }
            return formattedValue;
        }

        const inputs = document.querySelectorAll('input[type="tel"]');

        inputs.forEach(input => {
            input.addEventListener('input', function(e) {
                e.target.value = formatPhoneNumber(e.target.value);
            });
        });
    });
</script>
<body class="w-full flex justify-center flex-col items-center bg-[#fbfbfb]">
    <section class="w-80 h-full m-2 max-[320px]:w-full max-sm:p-2">

        <div class="w-full h-full bg-white mt-2 my-4 shadow-centered rounded-2xl">
            <nav class="w-full flex justify-between items-center p-3">
                <div id="backButton" class="h-7 w-7 rounded flex justify-center items-center cursor-pointer hover:bg-gray-100">
                    <p class="text-xl">←</p>
                </div>
                <p class="text-center"> Validation de commande </p>
                <div id="menuButton" class="h-8 w-8 ml-2 rounded flex justify-center items-center bg-[#f5f5f5] cursor-pointer hover:bg-[#ededed]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                </div>
            </nav>
        </div>

        <div class="w-full h-full flex justify-center items-center flex-col bg-white my-4 shadow-centered rounded-2xl p-5">
            <p class="text-3xl p-1">🚚</p>
            <p class="text-xl font-semibold flex text-center"> Formulaire de livraison </p>
            <img src="{{ url_for('user.static', filename='icons/arrow.svg') }}" alt="arrow" class="w-6 m-4">

            <form action="/checkout" method="POST" id="checkoutForm">
                <!-- Champs cachés pour maintenir les informations du produit -->
                <input type="hidden" name="storage" value="{{ storage }}">
                <input type="hidden" name="quantity" value="{{ quantity }}">
                
                <div class="w-64 h-12 border rounded-xl flex justify-start items-center bg-[#fafafa] p-[2px] max-[320px]:w-full numb_div">
                    <div class="h-full w-14 bg-gray-100 p-1 flex justify-center items-center rounded-xl">
                        <img src="{{ url_for('user.static', filename='icons/WA_icon.svg') }}" alt="" class="w-8">
                    </div>
                    <div class="flex justify-center items-center h-full">
                        <p class="text-xl px-1 font-bold">+225</p>
                        <input type="tel" name="user_phone_number" value="{{user_phone_number}}" placeholder="" class="w-full outline-none bg-[#fafafa] text-xl numb_input" required>
                    </div>
                </div>
                <style>
                    @keyframes spin {
                        to { transform: rotate(360deg); }
                    }
                    .animate-spin {
                        animation: spin 1s linear infinite;
                    }
                    .hidden {
                        display: none;
                    }
                </style>
                <input type="text" name="user_location" value="{{user_location}}" placeholder="Lieu de livraison" class="outline-none bg-[#fafafa] text-xl w-64 h-12 border rounded-xl flex justify-start items-center pl-3 mt-2 max-[320px]:w-full focus:outline-orange-200" required>
                <button type="submit" name="checkout_btn" id="commandButton" class="w-64 h-12 border font-semibold rounded-xl flex justify-center items-center bg-[#ffb800] p-3 mt-2 text-white max-[320px]:w-full hover:bg-[#ffb701] transition-colors duration-300">
                    <div id="buttonContent" class="flex items-center">
                        <span id="buttonText">Commander</span>
                        <span class="ml-1 w-5">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 7H19V17C19 18.6569 17.6569 20 16 20H8C6.34315 20 5 18.6569 5 17V7Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9 10L9 11C9 12.6569 10.3431 14 12 14V14C13.6569 14 15 12.6569 15 11L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M7 4H17L19 7H5L7 4Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                           
                        </span>
                    </div>
                    <svg id="loadingIcon" class="animate-spin hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="2" x2="12" y2="6"></line>
                        <line x1="12" y1="18" x2="12" y2="22"></line>
                        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                        <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                        <line x1="2" y1="12" x2="6" y2="12"></line>
                        <line x1="18" y1="12" x2="22" y2="12"></line>
                        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                        <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                    </svg>
                </button>
            </form>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    // Navigation buttons
                    const backButton = document.getElementById('backButton');
                    const menuButton = document.getElementById('menuButton');
                    
                    // Form validation elements
                    const form = document.getElementById('checkoutForm');
                    const button = document.getElementById('commandButton');
                    const buttonContent = document.getElementById('buttonContent');
                    const loadingIcon = document.getElementById('loadingIcon');
                    const phoneInput = document.querySelector('input[name="user_phone_number"]');
                    const locationInput = document.querySelector('input[name="user_location"]');
                    
                    // Back button functionality
                    if (backButton) {
                        backButton.addEventListener('click', function() {
                            window.history.back();
                        });
                    }
                    
                    // Menu button functionality
                    if (menuButton) {
                        menuButton.addEventListener('click', function() {
                            alert('Produit unique pas de menu');
                        });
                    }
                    
                    // Validation function
                    function validateForm() {
                        let isValid = true;
                        
                        // Validate phone number (must be exactly 10 digits)
                        const phoneValue = phoneInput.value.replace(/\D/g, ''); // Remove non-digits
                        const isPhoneValid = phoneValue.length === 10;
                        
                        // Validate location (must be more than 5 characters)
                        const locationValue = locationInput.value.trim();
                        const isLocationValid = locationValue.length > 3;
                        
                        isValid = isPhoneValid && isLocationValid;
                        
                        // Update button state
                        if (isValid) {
                            button.disabled = false;
                            button.classList.remove('opacity-50', 'cursor-not-allowed');
                            button.classList.add('hover:bg-[#ffb701]');
                        } else {
                            button.disabled = true;
                            button.classList.remove('hover:bg-[#ffb701]');
                            button.classList.add('opacity-50', 'cursor-not-allowed');
                        }
                        
                        // Update input styles for visual feedback
                        if (phoneInput.value.length > 0) {
                            if (isPhoneValid) {
                                phoneInput.parentElement.parentElement.classList.remove('border-red-300');
                                phoneInput.parentElement.parentElement.classList.add('border-green-300');
                            } else {
                                phoneInput.parentElement.parentElement.classList.remove('border-green-300');
                                phoneInput.parentElement.parentElement.classList.add('border-red-300');
                            }
                        } else {
                            phoneInput.parentElement.parentElement.classList.remove('border-red-300', 'border-green-300');
                        }
                        
                        if (locationInput.value.length > 0) {
                            if (isLocationValid) {
                                locationInput.classList.remove('border-red-300');
                                locationInput.classList.add('border-green-300');
                            } else {
                                locationInput.classList.remove('border-green-300');
                                locationInput.classList.add('border-red-300');
                            }
                        } else {
                            locationInput.classList.remove('border-red-300', 'border-green-300');
                        }
                        
                        return isValid;
                    }
                    
                    // Add event listeners for real-time validation
                    if (phoneInput) {
                        phoneInput.addEventListener('input', validateForm);
                    }
                    
                    if (locationInput) {
                        locationInput.addEventListener('input', validateForm);
                    }
                    
                    // Initial validation on page load
                    validateForm();
                    
                    // Form submission
                    if (form && button) {
                        form.addEventListener('submit', function(event) {
                            event.preventDefault();
                            
                            // Double-check validation before submitting
                            if (!validateForm()) {
                                return;
                            }
                            
                            button.disabled = true;
                            button.classList.remove('bg-[#ffb800]', 'hover:bg-[#ffb701]');
                            button.classList.add('bg-[#ffb800]', 'cursor-not-allowed');
                            buttonContent.classList.add('hidden');
                            loadingIcon.classList.remove('hidden');
                
                            setTimeout(() => {
                                form.submit();
                            }, 2000);
                        });
                    }
                });
            </script>
        </div>
    </section>
</body>
</html>
